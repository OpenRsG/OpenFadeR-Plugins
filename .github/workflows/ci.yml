name: CI

# Push / pull request: build and test the plugins inside a core checkout (they build against its sdk/).
# Tag v*: build on Linux, Windows and macOS and attach <plugin>-<os>-<arch>.zip to the release: the prebuilt libraries the
# app's one-click install downloads (releases/latest/download/...).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OpenRsG/OpenFadeR
          path: core
      - uses: actions/checkout@v4
        with:
          path: core/extension/plugin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/extension/plugin
      - run: core/extension/plugin/build.sh
      - run: cargo test --release --manifest-path core/extension/plugin/Cargo.toml

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OpenRsG/OpenFadeR
          path: core
      - uses: actions/checkout@v4
        with:
          path: core/extension/plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - run: core/extension/plugin/build.sh
      - run: python core/extension/plugin/package.py
      - uses: softprops/action-gh-release@v2
        with:
          files: core/extension/plugin/dist/*.zip
