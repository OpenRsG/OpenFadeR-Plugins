[workspace]
resolver = "2"
members = ["itunes", "sample-pack", "engine-dj", "serato", "virtualdj", "traktor", "mixxx"]

[workspace.dependencies]
openfader-plugin = { path = "../../sdk", features = ["library"] }
# Part of the app now (the rekordbox extensions are built into it); itunes and sample-pack still share its helpers.
rekordbox-common = { path = "../../crates/rekordbox-common" }
serde_json = "1"
# Each database plugin carries its own SQLCipher (the app links its own copy, for the rekordbox extensions).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# The SDK catches panics at the C ABI (catch_unwind): this MUST stay "unwind", "abort" would kill the host.
panic = "unwind"
