name: CI

# Push / pull request: build and test the plugins inside a matching core checkout (sdk/ and compatibility/rekordbox/common).
# Tag v* (or a manual run naming a tag): build on Linux, Windows and macOS (x86_64, and arm64 cross-compiled on the Intel runner) and
# attach <plugin>-<os>-<arch>.zip to that release: the prebuilt libraries the app's one-click install downloads
# (releases/latest/download/...).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the zips to"
        required: true

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OpenRsG/OpenFadeR
          ref: 129cdd4bb1c98fdd153787efa9d4d49197a7912c
          path: core
      - uses: actions/checkout@v4
        with:
          path: core/extension/plugin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/extension/plugin
      - run: core/extension/plugin/build.sh
      - run: cargo test --release --manifest-path core/extension/plugin/Cargo.toml

  release:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              arch: aarch64,
            }
          - { os: windows-latest }
          - { os: macos-15-intel, target: aarch64-apple-darwin, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OpenRsG/OpenFadeR
          ref: 129cdd4bb1c98fdd153787efa9d4d49197a7912c
          path: core
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: core/extension/plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: ARM Linux toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64
      - name: OpenSSL build tools (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"
      - run: core/extension/plugin/build.sh
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: "-C target-cpu=apple-m1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-cpu=cortex-a53"
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      - run: python core/extension/plugin/package.py
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: core/extension/plugin/dist/*.zip
