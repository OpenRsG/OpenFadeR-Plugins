[workspace]
resolver = "2"
members = ["sample-pack", "mixxx"]

[workspace.dependencies]
openfader-plugin = { path = "../../sdk", features = ["library"] }
# The built-in compatibility adapters share helpers with sample-pack.
compat-rekordbox-common = { path = "../../compatibility/rekordbox/common" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# The SDK catches panics at the C ABI (catch_unwind): this MUST stay "unwind", "abort" would kill the host.
panic = "unwind"
